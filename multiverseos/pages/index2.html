<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MultiverseOS — Image Atlas</title><link rel="stylesheet" href="/crystallic/styles.css">
</head>
<body>
  <main class="shell">
    <p class="eyebrow">Stage 02 / Crystallic image atlas</p>
    <h1>Everything visual, in one place.</h1>
    <p class="lede">Images placed in <code>multiverseos/crystallic/images</code> appear here automatically. No repository-wide scanning.</p>
    <div id="atlas" class="atlas" aria-live="polite"><p>Reading the Crystallic image folder…</p></div>
    <nav><a class="text-link" href="/index">← Arrival</a><a class="button" href="/index3">Continue to system map <span>→</span></a></nav>
  </main>
  <script>
    fetch('/api/v1/crystallic/images').then(response => response.json()).then(({images}) => {
      const atlas = document.querySelector('#atlas');
      atlas.replaceChildren();
      if (!images.length) { atlas.innerHTML = '<p class="empty">No images yet. Add assets to <code>multiverseos/crystallic/images</code>.</p>'; return; }
      images.forEach(image => { const figure = document.createElement('figure'); figure.innerHTML = `<img src="${image.url}" alt="${image.name}"><figcaption>${image.name}</figcaption>`; atlas.append(figure); });
    }).catch(() => { document.querySelector('#atlas').textContent = 'The image atlas is currently unavailable.'; });
  </script>
</body>
</html>
