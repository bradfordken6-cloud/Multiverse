services:
  omniverse-api:
    extends:
      file: ../docker-compose.yml
      service: multiverse-api
    container_name: omniverse-api

  omniverse-redis:
    extends:
      file: ../docker-compose.yml
      service: redis
    container_name: omniverse-redis

  omniverse-orchestrator:
    image: docker:27-cli
    container_name: omniverse-orchestrator
    working_dir: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace
    environment:
      COMPOSE_PROJECT_NAME: omniverse
    command: ["sh", "-c", "docker compose -f docker-compose.yml up -d --build && docker compose -f docker-compose.yml ps"]
    profiles: ["orchestrator"]
